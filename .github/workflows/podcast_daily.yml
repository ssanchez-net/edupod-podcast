name: Generador Diario de Podcast EduPod

on:
  schedule:
    # Programación automática: Todos los días a las 06:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecutar el proceso manualmente con un clic

jobs:
  procesar-podcast:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el repositorio
        uses: actions/checkout@v3

      - name: 2. Configurar entorno de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Instalar librerías necesarias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser edge-tts google-generativeai

      - name: 4. Ejecutar script de generación de audio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: 5. Almacenar el archivo MP3 generado
        uses: actions/upload-artifact@v3
        with:
          name: episodio-mp3-diario
          path: episodio_hoy.mp3
