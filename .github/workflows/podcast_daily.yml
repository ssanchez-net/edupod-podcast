name: Generador Diario de Podcast EduPod

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  procesar-podcast:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Instalar librerías necesarias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-genai

      - name: 4. Ejecutar script de generación de audio expresivo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: 5. Almacenar los archivos MP3 y TXT generados (Dinamicos por fecha)
        uses: actions/upload-artifact@v4
        with:
          name: eduradar-episodio-y-guion
          path: |
            episodio_*.mp3
            guion_*.txt
          retention-days: 7
