name: Generador Diario de Podcast EduPod

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  procesar-podcast:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el repositorio
        uses: actions/checkout@v4.2.2

      - name: 2. Instalar FFmpeg para mezcla de audio
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 3. Configurar entorno de Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: 4. Instalar librerías necesarias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-genai pydub

      - name: 5. Ejecutar script de generación y mezcla de audio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: 6. Persistir histórico de noticias en el repositorio
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add historico_noticias.json || true
          git commit -m "Auto-update: historico de noticias [skip ci]" || echo "Sin cambios en el histórico"
          git push || true

      - name: 7. Almacenar los archivos MP3 y TXT generados
        uses: actions/upload-artifact@v4.4.3
        with:
          name: eduradar-episodio-y-guion
          path: |
            episodio_*.mp3
            guion_*.txt
          if-no-files-found: warn
          retention-days: 7
