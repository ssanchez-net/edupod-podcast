name: Generador Semanal de Podcast Edu Radar

on:
  schedule:
    # Se ejecuta todos los viernes a las 06:00 UTC
    - cron: '0 6 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  procesar-podcast:
    # Cambiamos a una versión fija de servidor para evitar colas de espera
    runs-on: ubuntu-24.04
    # Si la máquina no responde en 15 minutos, se cancela para no congelar el proceso
    timeout-minutes: 15

    steps:
      - name: 1. Descargar el repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar FFmpeg para mezcla de audio
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 3. Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. Instalar librerías necesarias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-genai pydub

      - name: 5. Ejecutar script de generación con reintento automático
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        # Si falla el intento por un problema de red, GitHub reintenta ejecutar el script 1 vez más
        run: python main.py || python main.py

      - name: 6. Persistir histórico de noticias en el repositorio
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add historico_noticias.json || true
          git commit -m "Auto-update: historico semanal de noticias [skip ci]" || echo "Sin cambios en el histórico"
          git push || true

      - name: 7. Almacenar los archivos MP3 y TXT generados
        uses: actions/upload-artifact@v4
        with:
          name: eduradar-episodio-semanal
          path: |
            episodio_ep*.mp3
            guion_ep*.txt
          if-no-files-found: error
          retention-days: 14
