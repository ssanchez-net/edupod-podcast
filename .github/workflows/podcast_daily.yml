name: Generador Semanal de Podcast Edu Radar

on:
  schedule:
    # Se ejecuta todos los martes (2) y viernes (5) a las 06:15 UTC (00:15 AM hora del centro de México)
    - cron: '15 6 * * 2,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  procesar-podcast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 1. Descargar el repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar FFmpeg para mezcla de audio
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 3. Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. Instalar librerías necesarias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-genai pydub

      - name: 5. Ejecutar script de generación, audio y feed RSS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: 6. Publicar episodio, metadatos y feed.xml en GitHub Pages
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add historico_noticias.json episodios.json feed.xml index.html episodio_ep*.mp3 guion_ep*.txt || true
          git commit -m "Auto-publish: nuevo episodio y actualizacion RSS [skip ci]" || echo "Sin cambios que publicar"
          git push || true

      - name: 7. Respaldar artefactos MP3 y TXT
        uses: actions/upload-artifact@v4
        with:
          name: eduradar-episodio-semanal
          path: |
            episodio_ep*.mp3
            guion_ep*.txt
          if-no-files-found: error
          retention-days: 14
